<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dart Tycoon</title>
<meta name="dt-version" content="2.3.4">
<meta name="theme-color" content="#0e1511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dart Tycoon">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f0c;--panel:#131b16;--panel2:#1b261f;--line:#2a3a30;--green:#1f9d55;--green2:#2fd673;--gdark:#136b38;--red:#d9333f;--rdark:#8f1d26;--gold:#f4c430;--blue:#4c8dd6;--text:#eef3ef;--mut:#8ea394}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% -10%,#16301f 0,var(--bg) 60%) fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px}
img.sp{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit}
.btn{background:var(--green);color:#fff;border:none;border-bottom:4px solid var(--gdark);border-radius:8px;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.red{background:var(--red);border-color:var(--rdark)}
.btn.gray{background:#33433a;border-color:#1f2a24}
.btn.gold{background:var(--gold);color:#2a2000;border-color:#9c7a10}
.btn.sm{padding:8px 10px;font-size:13px;border-bottom-width:3px}
.btn:disabled{background:#2a332e;color:#6d7d73;border-color:#1c231f}
.btn.block{width:100%}
.top{display:flex;gap:4px;justify-content:space-between;align-items:center;padding:10px 10px;background:rgba(19,27,22,.96);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.st{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut);min-width:0}
.st b{font-size:13px;color:var(--text);white-space:nowrap}
.content{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:12px}
.tiny{font-size:11px}
h2{margin:0;font-size:13px}
h3{margin:0;font-size:15px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(19,27,22,.98);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:none;color:var(--mut);padding:9px 0 8px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button span{font-size:19px}
.nav button.on{color:var(--green2)}
.bar{height:10px;background:#0b110d;border:2px solid #000;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.bar.xp i{background:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:11px;white-space:nowrap}
.lvl{font-size:9px;color:var(--gold)}
/* Title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.logo{font-size:26px;line-height:1.4;color:var(--green2);text-shadow:3px 3px 0 #000,0 0 18px rgba(47,214,115,.35)}
.logo em{color:var(--red);font-style:normal}
input[type=text],textarea{width:100%;background:#0c130f;border:2px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font-size:16px;font-family:inherit}
textarea{font-size:12px;height:90px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls div{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.cls div.on{border-color:var(--green2);background:#173723}
.cls b{display:block;font-size:13px;margin:4px 0}
/* Cards */
.card{position:relative;background:linear-gradient(#24302a,#121914);color:#eef3ef;border-radius:9px;border:2px solid #2fd673;padding:13px 4px 5px;min-height:150px;display:flex;flex-direction:column;gap:3px;box-shadow:0 3px 0 #000,inset 0 0 0 1px rgba(255,255,255,.06);cursor:pointer;transition:transform .12s}
.card.t-wurf{border-color:#2fd673;background:linear-gradient(#1f3a2a,#101a14)}
.card.t-skill{border-color:#4c8dd6;background:linear-gradient(#1c2a40,#0f1520)}
.card.t-power{border-color:#c9a227;background:linear-gradient(#3a2e14,#17120a)}
.card.t-curse{border-color:#7a2a8f;background:linear-gradient(#2e1a36,#140c18)}
.card.r-u{box-shadow:0 3px 0 #000,0 0 0 1px #4c8dd6,0 0 8px rgba(76,141,214,.45)}
.card.r-r{box-shadow:0 3px 0 #000,0 0 0 1px #a259e6,0 0 10px rgba(162,89,230,.55)}
.card.r-leg{box-shadow:0 3px 0 #000,0 0 0 1px #f4c430,0 0 12px rgba(244,196,48,.7);animation:legglow 2.4s ease-in-out infinite}
@keyframes legglow{50%{box-shadow:0 3px 0 #000,0 0 0 1px #fff2b0,0 0 16px rgba(244,196,48,.95)}}
.card .cost{position:absolute;top:-9px;left:-7px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3a,#0a0a0a);color:var(--gold);font-family:'Press Start 2P';font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);z-index:2}
.card .cn{font-weight:800;font-size:10.5px;line-height:1.1;text-align:center;min-height:23px;display:flex;align-items:center;justify-content:center}
.card.up .cn{color:#7dffb0}
.card .art{height:36px;border-radius:5px;background:radial-gradient(circle,#2a3a30,#0a0f0c);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);overflow:hidden}
.card .art img{height:34px;width:34px;image-rendering:pixelated}
.card .art span{font-size:20px}
.card .cd{font-size:9px;line-height:1.22;color:#c8d4cc;flex:1}
.card .ctype{font-size:7.5px;text-transform:uppercase;letter-spacing:.6px;color:#8ea394;text-align:center;font-weight:800}
.card.r-leg .ctype{color:var(--gold)}
.card .pv{font-size:9.5px;font-weight:800;text-align:center;border-radius:4px;padding:2px;background:#0a0f0c;color:#e8e8e8}
.pv.co{background:var(--gold);color:#2a2000}
.pv.bust{background:var(--red);color:#fff}
.card.dis{filter:grayscale(.7) brightness(.7)}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--green2),0 6px 0 #000}
.legend{border-color:#c9a227;background:linear-gradient(#2a2410,#131b16)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* Combat */
.cb{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;width:100%;overflow:hidden}
.cbtop{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:2px solid var(--line);font-size:12px}
.legs{display:flex;gap:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mut)}
.dot.on{background:var(--green2);border-color:var(--green2)}
.dot.op.on{background:var(--red);border-color:var(--red)}
.opp{display:flex;gap:10px;align-items:center;padding:10px 12px}
.score{font-family:'Press Start 2P';font-size:26px}
.intent{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.intent .chip{background:#2a1416;border-color:#5a2228}
.arena{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:16px;min-height:0}
.arena .score{font-size:40px;color:var(--green2);text-shadow:3px 3px 0 #000}
.me{padding:6px 12px;display:flex;flex-direction:column;gap:6px}
.darts{display:flex;gap:4px}
.darts i{width:12px;height:22px;background:linear-gradient(var(--gold) 0 30%,#888 30% 70%,var(--red) 70%);clip-path:polygon(50% 0,100% 25%,70% 25%,70% 100%,30% 100%,30% 25%,0 25%);display:block}
.darts i.off{opacity:.2}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:16px 6px 8px;min-height:170px;align-content:end}
.hand.many{grid-template-columns:repeat(var(--n),1fr)}
.detail{margin:0 10px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-height:52px;display:flex;align-items:center;gap:10px}
.cbbot{display:flex;gap:8px;padding:6px 10px 10px}
.fx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:'Press Start 2P';font-size:16px;pointer-events:none;animation:fx 1.1s ease-out forwards;text-shadow:2px 2px 0 #000;white-space:nowrap;z-index:20}
@keyframes fx{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Map */
.step{display:flex;gap:8px;align-items:stretch}
.step .num{width:26px;font-family:'Press Start 2P';font-size:9px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.nodes{flex:1;display:flex;gap:8px}
.node{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;font-weight:600}
.node span{display:block;font-size:22px;margin-bottom:2px}
.node.cur{border-color:var(--green2);background:#173723;cursor:pointer;animation:pulse 1.6s infinite}
.node.done{opacity:.45}
.node.chosen{opacity:1;border-color:var(--gold)}
.node.fut{opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(47,214,115,.25)}}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--panel);border:2px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:16px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000c;border:2px solid var(--line);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;animation:up .2s}
.trophies{display:flex;gap:6px;flex-wrap:wrap}
.relics{display:flex;gap:4px;flex-wrap:wrap}
.relic{font-size:18px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 5px;cursor:pointer}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:12px;text-align:left;color:var(--text);font-size:14px;cursor:pointer}
.opt b{display:block;margin-bottom:2px}
.opt:disabled{opacity:.45}
.cloud{font-size:10px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--mut);font-size:11px;font-weight:600}
.tbl td.n{text-align:left;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr.mine td{background:#173723;font-weight:800}
.tbl tr.up td:first-child{color:var(--green2)}
.tbl tr.down td:first-child{color:var(--red)}
.gtile{background:var(--panel2);border:3px solid var(--rc,#9aa7a0);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.pack .gtile{opacity:0;animation:flip .5s ease-out forwards}
.gtile.l{box-shadow:0 0 18px rgba(244,196,48,.55)}
.gtile.e{box-shadow:0 0 12px rgba(162,89,230,.45)}
@keyframes flip{0%{opacity:0;transform:rotateY(90deg) scale(.8)}100%{opacity:1;transform:none}}
.gi{font-size:26px}
.gname{font-weight:800;font-size:12px;line-height:1.2}
.gfx{font-size:10.5px;color:#cfe3d6;line-height:1.3}
.grar{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--rc)}
.slotbtn{display:flex;align-items:center;gap:10px;width:100%}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ach.off{opacity:.45}
.ach .ai{font-size:22px;width:30px;text-align:center}
.packcard{display:flex;gap:12px;align-items:center}
.packbox{width:54px;height:62px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #000;box-shadow:0 3px 0 #000;flex-shrink:0}
.deckgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding-top:8px}

.fm{display:flex;flex-direction:column;gap:8px;padding:8px 12px 14px;max-width:480px;margin:0 auto;min-height:100vh}
.fpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp{display:flex;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.fp.op{justify-content:flex-end}.fp.on{border-color:var(--green2)}.fp.op.on{border-color:var(--red)}
.fp .score{font-size:20px;margin:3px 0}
.fbwrap{position:relative;align-self:center;width:min(100%,46vh,400px);aspect-ratio:1}
#fcv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.fpop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:'Press Start 2P';font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;white-space:nowrap;animation:fx 1s ease-out forwards}
.fco{min-height:18px;text-align:center;font-size:12.5px;color:var(--gold)}
.fpip{width:12px;height:12px;border:2px solid var(--green);border-radius:2px;display:inline-block}.fpip.on{background:var(--green)}
.fdart{width:8px;height:16px;background:#efe6cf;display:inline-block;clip-path:polygon(50% 0,100% 35%,68% 35%,68% 100%,32% 100%,32% 35%,0 35%)}.fdart.u{opacity:.2}
.fhand{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px 10px}
.fcard{flex:0 0 100px;min-height:122px;background:linear-gradient(#1d2721,#131915);border:2px solid var(--gdark);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:4px;color:var(--text);text-align:left;position:relative;font-family:inherit;cursor:pointer}
.fcard:disabled{opacity:.38;cursor:default}
.fcard .fc{position:absolute;top:-9px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-family:'Press Start 2P';font-size:10px;border:2px solid var(--bg);color:#fff}
.fcard .fi{font-size:22px;text-align:center}.fcard .ft{font-weight:800;font-size:12px}.fcard .fd{font-size:10.5px;color:#b9c4bc;line-height:1.3}
.seg{display:flex;gap:6px;margin-bottom:2px}.seg button{flex:1}
.scene{display:block;width:100%;height:auto}
.scene .hot{cursor:pointer}
.scene .obj{animation:objp 2.6s ease-in-out infinite}
@keyframes objp{0%,100%{opacity:1}50%{opacity:.82}}
.streetwrap{position:relative}
.street{overflow-x:auto;border-radius:12px;border:2px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#0b1330}
.street::-webkit-scrollbar{display:none}
.streetin{width:1280px}
.citywrap{overflow:auto;height:min(60vh,520px);border-radius:12px;border:2px solid var(--line);background:#6ab4f0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.citywrap::-webkit-scrollbar{display:none}
.pxwrap{position:relative;line-height:0}
.pximg{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.hitsvg{position:absolute;inset:0;width:100%;height:100%}
.hitr{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:1.5;vector-effect:non-scaling-stroke}
.hitr:active{fill:rgba(255,255,255,.07)}
.hitr.obj{}
@keyframes hitp{50%{stroke:rgba(244,196,48,.5)}}
.smoke{animation:smoke 3.9s linear infinite;opacity:0}
@keyframes smoke{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}100%{transform:translate(7px,-16px);opacity:0}}
.twinkle{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}
.walker{animation:walk 40s linear infinite}@keyframes walk{from{transform:translateX(0)}to{transform:translateX(680px)}}
.heimgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.heimroom{background:#0b0f0d;border:2px solid #5a3b22;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;color:var(--text);font-weight:800;font-size:13px;font-family:inherit}
.heimroom span{display:block;padding:7px 6px}
.arr{position:absolute;top:44%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:2px solid #000;background:rgba(19,27,22,.85);color:#fff;font-size:14px;cursor:pointer}
.arr.l{left:6px}.arr.r{right:6px}
.roomframe{border-radius:12px;border:3px solid #5a3b22;overflow:hidden;background:#000}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#aim{position:fixed;inset:0;background:rgba(6,9,7,.97);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#aim.on{display:flex}
#aim .atag{font-family:'Press Start 2P';font-size:9px;color:var(--gold);letter-spacing:1px}
#aim .atitle{font-weight:800;font-size:17px;text-align:center}
#aim .asub{font-size:13px;color:var(--mut);text-align:center}
#aimcv{width:min(90vw,50vh,420px);height:min(90vw,50vh,420px);border-radius:50%;border:3px solid var(--line);touch-action:none;background:#0a0c0b;box-shadow:0 0 0 6px #000,0 0 40px rgba(244,196,48,.15)}
#aimres{font-family:'Press Start 2P';font-size:15px;min-height:20px;text-shadow:2px 2px 0 #000}
#aimbtn{font-family:'Press Start 2P';font-size:14px;padding:16px 34px;background:var(--red);border-color:var(--rdark)}

#coach{position:fixed;left:8px;right:8px;bottom:70px;z-index:40;display:flex;gap:10px;align-items:flex-start;background:#0e1511f2;border:2px solid var(--gold);border-radius:12px;padding:10px;box-shadow:0 6px 20px #000a;max-width:520px;margin:0 auto;animation:coachIn .3s ease-out}
#coach.top{top:58px;bottom:auto}
#coach img{width:48px;height:48px;image-rendering:pixelated;border-radius:8px;background:#1a2a20;flex:none}
@keyframes coachIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.card .fcost{position:absolute;top:-7px;right:-6px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fd3ff,#2d6cdf 60%,#123a80);border:2px solid #0a1a3a;color:#fff;font:bold 11px/18px system-ui;text-align:center;box-shadow:0 2px 0 #000;z-index:3}
.trow{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.trow .chip{font-size:10px;padding:2px 6px}
.pcbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gold);font-size:10px;cursor:pointer}
.pcard{margin:4px auto 10px;width:100%;max-width:300px;box-sizing:border-box;border-radius:16px;padding:12px;border:3px solid #6a7a70;background:linear-gradient(160deg,#25332b,#0d1410);box-shadow:0 8px 0 #000,inset 0 0 0 2px #ffffff12;text-align:center}

<script>
"use strict";
/* ================= Helpers ================= */
const SAVE_KEY='dartTycoon_v2';try{localStorage.removeItem('dartTycoon_v1')}catch(e){}

const fmt=n=>Math.round(n).toLocaleString('de-DE');

let _u=0;const uid=()=>Date.now().toString(36)+(_u++).toString(36)+Math.floor(R()*1e5).toString(36);

/* ================= Pixel-Sprites ================= */

"...hhhhhh...",
"..hhhhhhhh..",
"..hssssssh..",
"..sesssses..",
"..ssssssss..",
"...ssmmss...",

const HAIRS=['#2b1d14','#6b3e1f','#c9a15a','#1a1a1a','#8a8a8a','#b5462b','#e8e0c8'];
const SHIRTS=['#1f9d55','#d9333f','#222','#2d6cdf','#f4c430','#7d3cc8','#e07b24','#16a3a3','#ffffff'];
const spCache={};
function spriteURL(rows,pal){
  const key=rows.join('|')+JSON.stringify(pal);
  if(spCache[key])return spCache[key];
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});
  return spCache[key]=c.toDataURL();
}
function randLook(shirt){return{h:pick(HAIRS),s:pick(SKINS),t:shirt||pick(SHIRTS),w:pick(SHIRTS),p:pick(['#2b2f3a','#3b3b3b','#1d3557','#4a3b2a']),bald:R()<.18,beard:R()<.3}}
function personSprite(L){
  let rows=PERSON.slice();
  if(L.bald){rows[0]=rows[0].replace(/h/g,'.');rows[1]="..ssssssss.."}
  if(L.beard){rows[5]="..shhmmhhs..";rows[6]="...hhhhhh..."}
  return spriteURL(rows,{h:L.h,s:L.s,e:'#111',m:'#7a2c2c',t:L.t,w:L.w,p:L.p,b:'#141414'});
}
function personImg(L,size=48){return `<img class="sp" src="${personSprite(L)}" style="width:${size*.75}px;height:${size}px">`}
let BOARD_URL=null;
function boardURL(){
  if(BOARD_URL)return BOARD_URL;
  const n=41,c=document.createElement('canvas');c.width=n;c.height=n;const x=c.getContext('2d');const m=(n-1)/2;
  for(let y=0;y<n;y++)for(let i=0;i<n;i++){
    const dx=i-m,dy=y-m,r=Math.sqrt(dx*dx+dy*dy)/(n/2);
    if(r>1)continue;
    const a=(Math.atan2(dy,dx)+Math.PI*2+Math.PI/20)%(Math.PI*2);const seg=Math.floor(a/(Math.PI/10))%2;
    let col;
    if(r>.86)col='#111';else if(r>.77)col=seg?'#d9333f':'#1f9d55';else if(r>.5)col=seg?'#151515':'#efe2c2';
    else if(r>.42)col=seg?'#d9333f':'#1f9d55';else if(r>.12)col=seg?'#151515':'#efe2c2';else if(r>.06)col='#1f9d55';else col='#d9333f';
    x.fillStyle=col;x.fillRect(i,y,1,1);
  }
  return BOARD_URL=c.toDataURL();
}

"..wggggggggggggggggggw..",

"..wggggggggggggggggggw..",
"..wwwwwwwwwwwwwwwwwwww..",
"..wyyyywwwwddddwwwyyyyw.",
"..wyKKywwwwdkkdwwwyKKyw.",
"..wyyyywwwwddddwwwyyyyw.",
"..wwwwwwwwwddddwwwwwwww.",

"ssssssssssssssssssssssss"];

"gggggggggggg",

/* ================= Daten: Karten ================= */
const RAR={start:'Start',c:'Gewöhnlich',u:'Selten',r:'Episch',curse:'Fluch'};
const CARDS={
 s20:{n:'Single 20',c:1,t:'wurf',r:'start',th:(C,u)=>[{pts:u?25:20,ch:1,k:'single'}],d:u=>`Sicher ${u?25:20} Punkte.`},

 t19:{n:'Triple 19',c:1,t:'wurf',r:'c',th:(C,u)=>[{pts:57,alt:19,ch:u?.72:.62,k:'triple'}],d:u=>`${u?72:62}%: 57 Punkte, sonst 19.`},
 d8:{n:'Doppel 8',c:1,t:'wurf',r:'c',th:(C,u)=>[{pts:16,alt:0,ch:u?.98:.9,k:'double'}],d:u=>`${u?98:90}%: Checkt Rest bis 16 aus. Sonst 16 Pkt.`},

 set:{n:'Aufsetzen',c:1,t:'wurf',r:'c',th:(C,u)=>[{pts:clamp(C.me.rest-40,0,u?130:100),ch:1,k:'set'}],fx:()=>draw(1),d:u=>`Wirf genau so viel, dass 40 übrig bleiben (max ${u?130:100}). Ziehe 1.`},
 lucky:{n:'Glückswurf',c:0,t:'wurf',r:'c',ex:true,th:(C,u)=>[{pts:rnd(u?20:1,60),ch:1,k:'single',rand:true}],d:u=>`Zufällig ${u?20:1}–60 Pkt. Einmal pro Leg.`},

 stare:{n:'Starrer Blick',c:1,t:'skill',r:'u',fx:(C,u)=>{C.opp.st.nerv+=u?3:2},d:u=>`Gegner ${u?3:2} Züge nervös: −25% Punkte, halber Druck, schlechter Checkout.`},

function makeItem(rar,slot){
  slot=slot||pick(Object.keys(SLOTS));
  const R0=GRAR[rar];
  const keys=Object.keys(GFX).filter(k=>GFX[k].sl.includes(slot)&&(!GFX[k].min||rar==='e'||rar==='l'));
  const fx={};
  shuffle(keys.slice()).slice(0,R0.k).forEach(k=>{let v=Math.max(1,Math.round(GFX[k].b*R0.m*(.8+R()*.4)));if(k==='draw')v=1;fx[k]=v});
  const name=rar==='l'?`${pick(LEGNAMES)}-${SLOTS[slot].n}`:pick(GNAMES[slot]);
  return{id:uid(),slot,rar,name,fx,col:rar==='l'?'#f4c430':pick(GCOLS)};
}
function rollRar(odds){let t=0;for(const k in odds)t+=odds[k];let r=R()*t;for(const k in odds){r-=odds[k];if(r<=0)return k}return 'c'}

function itemById(id){return id&&S.inv.find(x=>x.id===id)}

  </svg>`;

function itemTile(it,extra='',delay){return `<div class="gtile ${it.rar}" style="--rc:${GRAR[it.rar].col};${delay!=null?`animation-delay:${delay}s`:''}"><div class="gi">${SLOTS[it.slot].i}</div><div class="grar">${GRAR[it.rar].n} ${SLOTS[it.slot].n}</div><div class="gname">${esc(it.name)}</div><div class="gfx">${fxText(it.fx)}</div>${extra}</div>`}
function openPack(type,free){
  const P=PACKS[type];
  if(free){if(!S.packs[type])return;S.packs[type]--}
  else{if(S.money<P.price||S.rep<P.rep)return;S.money-=P.price}
  const items=[0,1,2].map(()=>makeItem(rollRar(P.odds)));
  S.inv.push(...items);S.stats.packs++;
  if(items.some(i=>i.rar==='l'))S.stats.legend++;
  save();
  modal(`<h3>📦 ${P.n}</h3><div class="grid3 pack">${items.map((it,i)=>itemTile(it,'',.25+i*.55)).join('')}</div>
   <div class="small mut">Rüste die Teile im Kader unter „🎯 Dart“ aus.</div>
   <div class="row"><button class="btn gray" style="flex:1" id="pk-again" ${free?(S.packs[type]>0?'':'disabled'):(S.money<P.price?'disabled':'')}>${free?`Nächstes (${S.packs[type]})`:`Noch eins (${P.price} €)`}</button><button class="btn" style="flex:1" onclick="closeModal();render()">Super!</button></div>`);
  items.forEach((it,i)=>setTimeout(()=>snd(it.rar==='l'?'win':it.rar==='e'?'power':'skill'),250+i*550));
  $('#pk-again').onclick=()=>openPack(type,free);
  render();
}

function itemScore(it,p){let sc=0;for(const k in it.fx){let w=GW[k]||1;if(p&&p.cls==='scorer'&&k==='tri')w*=1.35;if(p&&(p.cls==='finisher'||p.cls==='rechner')&&k==='dbl')w*=1.35;if(p&&p.cls==='bulljaeger'&&(k==='tri'||k==='dbl'))w*=1.15;sc+=w*it.fx[k]}return sc}
function bestGear(p,silent){p.gear=p.gear||{};let ch=0;for(const sl in SLOTS){const cur=itemById(p.gear[sl]);const opts=S.inv.filter(it=>it.slot===sl&&(!ownerOf(it.id)||ownerOf(it.id)===p));const best=opts.sort((a,b)=>itemScore(b,p)-itemScore(a,p))[0];
  if(best&&(!cur||itemScore(best,p)>itemScore(cur,p))){p.gear[sl]=best.id;ch++}}if(!silent){snd(ch?'power':'click');toast(ch?`⭐ ${ch} ${ch===1?'Teil':'Teile'} besser ausgerüstet`:'Schon optimal ausgerüstet')}save();return ch}

const DIVS=['Kreisliga','Bezirksliga','Landesliga','Oberliga','Bundesliga'];
const CLUBS=['DC Bullseye Jena','SV Triple Zwickau','Dart Devils Chemnitz','TSG Doppel 16 Weimar','Leipzig Arrows','1. DC Erfurt','Steel Tigers Plauen','DV Altenburg','DC Saalfeld 09','Bull Hunters Dresden','Zielwasser Gotha','Oche Kings Halle','Flight Club Suhl','DSV Greiz','Treble Twenty Apolda','Checkout Crew Jena'];
function makeSchedule(n){
  const ids=[...Array(n).keys()],rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++)pr.push([ids[i],ids[n-1-i]]);rounds.push(pr);ids.splice(1,0,ids.pop())}
  return rounds.concat(rounds.map(pr=>pr.map(([a,b])=>[b,a])));
}
function initLeague(div,season,st){
  st=st||S;
  const names=shuffle(CLUBS.filter(c=>!st.rival||c!==st.rival.name)).slice(0,5);if(st.rival)names[0]=st.rival.name;
  const teams=[{name:st.club,me:true,str:0,pts:0,lf:0,la:0,w:0,l:0}].concat(names.map((n,i)=>({name:n,str:clamp(.15+R()*.6+(i===0?.2:0),0,1),pts:0,lf:0,la:0,w:0,l:0})));
  st.league={div,season,day:0,teams,sched:makeSchedule(6),results:[]};
  st.leagueDone=false;
}
function sortedTable(){return S.league.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts||(b.lf-b.la)-(a.lf-a.la)||b.lf-a.lf)}
function oppIndex(){const L=S.league;if(L.day>=L.sched.length)return -1;const pr=L.sched[L.day].find(p=>p.includes(0));return pr[0]===0?pr[1]:pr[0]}
function applyRes(i,j,li,lj){const T=S.league.teams;T[i].lf+=li;T[i].la+=lj;T[j].lf+=lj;T[j].la+=li;if(li>lj){T[i].pts+=2;T[i].w++;T[j].l++}else{T[j].pts+=2;T[j].w++;T[i].l++}}
function simDay(lf,la){
  const L=S.league,T=L.teams;
  for(const [a,b] of L.sched[L.day]){
    if(a===0||b===0){const o=a===0?b:a;applyRes(0,o,lf,la);L.results.push({day:L.day+1,opp:T[o].name,lf,la});continue}
    const pa=.5+(T[a].str-T[b].str)*.6,N=nightN(L.div),need=Math.floor(N/2)+1;let x=0,y=0;
    while(x<need&&y<need){if(R()<pa)x++;else y++}
    applyRes(a,b,x,y);
  }
  L.day++;
}
function seasonEnd(){
  const L=S.league,tab=sortedTable(),rank=tab.findIndex(t=>t.me)+1,d=L.div;
  const money=[300,180,90,60,30,0][rank-1]*(d+1),rep=[20,12,6,3,1,0][rank-1]*(d+1);
  S.money+=money;S.rep+=rep;
  let nd=d,msg=`Saison ${L.season} beendet: Platz ${rank} in der ${DIVS[d]}. +${money} €, +${rep} Ruf.`;
  if(rank===1){S.trophies.push({tier:-1,n:`Meister ${DIVS[d]}`,i:'🏅',w:S.week});msg+=` 🏅 Meistertitel!`}
  if(rank<=2&&d<4){nd++;S.stats.promo++;msg+=` ⬆ Aufstieg in die ${DIVS[nd]}!`}
  else if(rank===6&&d>0){nd--;msg+=` ⬇ Abstieg in die ${DIVS[nd]}.`}
  log(msg);
  initLeague(nd,L.season+1);initPokal();
  return msg;
}

let DBREF=null,cloudBusy=false,cloudPending=null,saveTimer=null,cloudOn=false;
function save(){
  if(!S)return;checkAch();S.ts=Date.now();
  const json=JSON.stringify(S);
  try{localStorage.setItem(SAVE_KEY,json)}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudSave(json),1500);
}
async function cloudSave(json){
  if(!DBREF)return;
  if(cloudBusy){cloudPending=json;return}
  cloudBusy=true;
  try{await DBREF.set({json,ts:Date.now()})}catch(e){if(e&&e.code==='invalid_argument'){DBREF=null;cloudOn=false}}
  cloudBusy=false;
  if(cloudPending){const j=cloudPending;cloudPending=null;cloudSave(j)}
}
function loadLocal(){try{const j=localStorage.getItem(SAVE_KEY);if(j){const st=JSON.parse(j);if(st&&st.sv>=2)return st}}catch(e){}return null}

let AC=null;
function snd(type){
  if(S&&S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f,d,w='square',v=.05,dl=0,sl)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,t+dl);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+dl+d);g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g);g.connect(AC.destination);o.start(t+dl);o.stop(t+dl+d+.03)};
    const thunk=(dl=0)=>tone(220,.07,'triangle',.18,dl,55);
    ({
      hit:()=>{thunk();tone(880,.07,'square',.04,.04);tone(1320,.08,'square',.03,.09)},
      score:()=>{thunk()},
      miss:()=>{thunk();tone(260,.18,'sawtooth',.035,.03,130)},
      checkout:()=>{thunk();[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,.06+i*.09))},
      bust:()=>{tone(150,.4,'sawtooth',.07,0,60)},
      skill:()=>{tone(660,.06,'triangle',.06);tone(990,.08,'triangle',.05,.05)},
      power:()=>{[392,523,659].forEach((f,i)=>tone(f,.12,'triangle',.06,i*.06))},
      opp:()=>{thunk();thunk(.12);thunk(.24)},
      hurt:()=>{tone(180,.2,'square',.05,0,90)},
      click:()=>{tone(700,.025,'square',.025)},
      coin:()=>{tone(988,.07,'square',.05);tone(1319,.15,'square',.05,.07)},
      win:()=>{[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.05,i*.1))},
      lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.15))},
    }[type]||(()=>{}))();
  }catch(e){}
}

function startNerves(p){return bl('gym')*4+(p.cls==='champion'?10:0)+(hasT(p,'nerv')?8:0)-(hasT(p,'party')?3:0)+34+p.lvl*3+S.b.bar*4+(gearOf(p).nerv||0)+decoSum('nerv')+perk('nerven')*3+(p.legend==='macht'?10:0)}
function genMap(steps){
  const map=[];
  for(let s=0;s<steps;s++){
    if(s===steps-1){map.push(['boss']);continue}
    if(s===0){map.push(['match']);continue}
    const n=R()<.55?3:2,opts=[];
    const pool=[['match',38],['elite',s>=2?13:0],['bar',15],['shop',s>=1?13:0],['event',21]];
    for(let i=0;i<n;i++){
      let tot=pool.reduce((a,p)=>a+p[1],0),r=R()*tot;
      for(const p of pool){r-=p[1];if(r<=0){opts.push(p[0]);break}}
    }
    if(!opts.includes('match')&&!opts.includes('elite'))opts[0]='match';
    map.push(opts);
  }
  return map;
}
function startRun(tier,pid){
  const T=TIERS[tier],p=player(pid);
  S.money-=T.fee;S.played=true;
  const deck=p.deck.map(c=>({id:c.id,up:c.up,u:uid()}));
  if(S.b.training>=5){const c=deck.filter(x=>!x.up);if(c.length)pick(c).up=true}
  const mx=startNerves(p);
  S.run={tier,pid,gear:gearOf(p),deck,relics:[],nerves:mx,maxN:mx,gold:0,step:0,steps:T.steps,map:genMap(T.steps),path:[],added:[],combat:null,won:0,matches:0};
  p.fat=Math.min(100,(p.fat||0)+25);if(S.mg&&S.mg.talQ>0){S.mg.talQ--;const t=randomTal();if(t)S.run.relics.push(t)}
  S.run.asc=ascInfo().cur;ascApplyRun(S.run);if(p.cls==='champion'){const t=randomTal();if(t)S.run.relics.push(t)}if(S.storyBoost){S.run.maxN+=S.storyBoost;S.run.nerves+=S.storyBoost;S.storyBoost=0}
  log(`${p.name} startet ${T.bei} ${T.n}.`);
  save();render();
}

function enterNode(i){

function heal(n){const r=S.run;const before=r.nerves;r.nerves=Math.min(r.maxN,r.nerves+n);return r.nerves-before}
function addCard(id,up=false){const c={id,up,u:uid()};S.run.deck.push(c);S.run.added.push(c.u);return c}

function randomRelic(){const opts=Object.keys(RELICS).filter(k=>!S.run.relics.includes(k)&&!RELICS[k].tal);return opts.length?pick(opts):null}
function randomCard(rar){

function cardChoices(n,elite){
  const out=[];let guard=0;

    let rar;const x=R();
    if(elite)rar=x<.25?'r':x<.7?'u':'c';else rar=x<.08?'r':x<.38?'u':'c';
    const id=randomCard(rar);if(!out.includes(id))out.push(id);
  }
  return out;
}

/* ================= Zielmodus (Finale/Boss & Liga-Entscheidung) ================= */
const BO=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const BR={bull:6.35,obull:15.9,tIn:99,tOut:107,dIn:162,dOut:170,edge:225};
const deg=d=>d*Math.PI/180;
function bScore(x,y){const r=Math.hypot(x,y);if(r<=BR.bull)return'BULL';if(r<=BR.obull)return'25';if(r>BR.dOut)return'MISS';
  let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;const v=BO[Math.floor(((a+9)%360)/18)];
  return (r>=BR.tIn&&r<=BR.tOut?'T':r>=BR.dIn?'D':'')+v}
function bPoint(seg,r){const a=deg(BO.indexOf(seg)*18);return{x:r*Math.sin(a),y:-r*Math.cos(a)}}
function aimGauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function aimZone(sp){
  if(sp.k==='bull')return{lbl:'BULL',c:{x:0,y:0},base:13,name:'Bullseye',seg:0,rings:[[0,BR.bull]]};
  if(sp.k==='triple'&&sp.pts%3===0&&sp.pts/3<=20){const s=sp.pts/3;return{lbl:'T'+s,c:bPoint(s,103),base:12,name:'Triple '+s,seg:s,rings:[[BR.tIn,BR.tOut]]}}
  if(sp.k==='double'&&sp.pts%2===0&&sp.pts/2<=20){const s=sp.pts/2;return{lbl:'D'+s,c:bPoint(s,166),base:13,name:'Doppel '+s,seg:s,rings:[[BR.dIn,BR.dOut]]}}
  if(sp.k==='single'&&Number.isInteger(sp.pts)&&sp.pts>=1&&sp.pts<=20&&!sp.rand){const s=sp.pts;return{lbl:''+s,c:bPoint(s,135),base:55,name:'Single '+s,seg:s,rings:[[BR.obull,BR.tIn],[BR.tOut,BR.dIn]]}}
  return null;
}
function aimActive(sp){
  if(UI.auto)return false;
  const C=S&&S.run&&S.run.combat;if(!C||!C.aim||sp.ch>=1)return false;
  if(C.aim==='dbl'&&sp.k!=='double')return false;
  if(accFor(sp)>=1)return false;
  return !!aimZone(sp);
}
let AIM=null,AIM_DARTS=[];
function aimWob(){const t=(performance.now()-AIM.t0)/1000+AIM.ph,A=AIM.A,s=AIM.spd;
  return{x:AIM.z.c.x+A*Math.sin(t*1.9*s)*Math.cos(t*.73*s),y:AIM.z.c.y+A*.9*Math.sin(t*2.6*s+1.3)}}
function aimThrow(sp,i,n,cardName){
  return new Promise(res=>{
    const z=aimZone(sp),acc=accFor(sp),A=z.base*(1.6-acc),spd=1.15+(1-acc)*1.6;
    if(i===0)AIM_DARTS=[];
    AIM={z,A,spd,V:clamp(A*2+34,50,130),t0:performance.now(),ph:R()*60,res,landed:null};
    $('#aimt').textContent=`${cardName}${n>1?` · Pfeil ${i+1}/${n}`:''}`;
    $('#aims').innerHTML=`Ziel: <b style="color:var(--gold)">${z.name}</b> · Ruhige Hand ${Math.round(acc*100)} %`;
    $('#aimres').textContent='';$('#aimbtn').disabled=false;
    const el=$('#aim');el.classList.add('on');
    const cv=$('#aimcv'),w=cv.getBoundingClientRect().width,dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(w*dpr);
    cv.onpointerdown=aimRelease;$('#aimbtn').onclick=aimRelease;
    requestAnimationFrame(aimDraw);
  });
}
function aimRelease(){
  if(!AIM||AIM.landed)return;
  const w=aimWob(),x=w.x+aimGauss()*3.2,y=w.y+aimGauss()*3.2,hit=bScore(x,y)===AIM.z.lbl;
  AIM.landed={x,y,hit};AIM_DARTS.push({x,y,hit});$('#aimbtn').disabled=true;
  const r=$('#aimres');r.textContent=hit?'TREFFER!':'DANEBEN';r.style.color=hit?'#7dffb0':'#ff8a8a';
  snd(hit?'hit':'miss');buzz(hit?[30,30,30]:80);
  const done=AIM.res;setTimeout(()=>done(hit),850);
}
function aimClose(){$('#aim').classList.remove('on');AIM=null;AIM_DARTS=[]}
function aimSector(g,r0,r1,i){const a0=deg(-99+i*18),a1=a0+deg(18);g.moveTo(Math.cos(a0)*r1,Math.sin(a0)*r1);g.arc(0,0,r1,a0,a1);g.arc(0,0,r0,a1,a0,true);g.closePath()}
function aimDraw(){
  if(!AIM)return;
  const cv=$('#aimcv'),g=cv.getContext('2d'),W=cv.width,k=W/(2*AIM.V),z=AIM.z;
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#0a0c0b';g.fillRect(0,0,W,W);
  g.setTransform(k,0,0,k,W/2-z.c.x*k,W/2-z.c.y*k);
  g.fillStyle='#050605';g.beginPath();g.arc(0,0,BR.edge,0,7);g.fill();
  for(let i=0;i<20;i++){const dark=i%2===0,single=dark?'#161616':'#efe6cf',ring=dark?'#d6362f':'#1a9a5a';
    [[BR.obull,BR.tIn,single],[BR.tIn,BR.tOut,ring],[BR.tOut,BR.dIn,single],[BR.dIn,BR.dOut,ring]].forEach(([a,b,c])=>{g.beginPath();aimSector(g,a,b,i);g.fillStyle=c;g.fill()})}
  g.fillStyle='#1a9a5a';g.beginPath();g.arc(0,0,BR.obull,0,7);g.fill();
  g.fillStyle='#d6362f';g.beginPath();g.arc(0,0,BR.bull,0,7);g.fill();
  g.strokeStyle='rgba(200,200,190,.55)';g.lineWidth=1.2/k;
  [BR.obull,BR.tIn,BR.tOut,BR.dIn,BR.dOut].forEach(r=>{g.beginPath();g.arc(0,0,r,0,7);g.stroke()});
  for(let i=0;i<20;i++){const a=deg(-99+i*18);g.beginPath();g.moveTo(Math.cos(a)*BR.obull,Math.sin(a)*BR.obull);g.lineTo(Math.cos(a)*BR.dOut,Math.sin(a)*BR.dOut);g.stroke()}
  g.fillStyle='#e9efe9';g.font='14px "Press Start 2P", monospace';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<20;i++){const a=deg(-90+i*18);g.fillText(BO[i],Math.cos(a)*197,Math.sin(a)*197)}
  // Zielfeld
  const pulse=.55+.45*Math.sin(performance.now()/180);
  g.beginPath();
  if(z.lbl==='BULL')g.arc(0,0,BR.bull,0,7);else{const i=BO.indexOf(z.seg);z.rings.forEach(([a,b])=>aimSector(g,a,b,i))}
  g.fillStyle=`rgba(244,196,48,${.18+.14*pulse})`;g.fill();g.strokeStyle=`rgba(244,196,48,${.6+.4*pulse})`;g.lineWidth=3/k;g.stroke();
  // Pfeile
  AIM_DARTS.forEach(d=>{const u=4/k;g.fillStyle='#000';g.fillRect(d.x-u*1.6,d.y-u*1.6,u*3.2,u*3.2);g.fillStyle=d.hit?'#7dffb0':'#ff6b6b';g.fillRect(d.x-u,d.y-u,u*2,u*2);
    g.fillStyle='#cfd6d2';for(let j=1;j<6;j++)g.fillRect(d.x+j*u,d.y-j*u-u/2,u,u);g.fillStyle='#1f9d55';g.fillRect(d.x+6*u,d.y-9*u,2*u,4*u);g.fillStyle='#d9333f';g.fillRect(d.x+5*u,d.y-8*u,4*u,2*u)});
  // Fadenkreuz
  if(!AIM.landed){const w=aimWob(),L=16/k;
    g.strokeStyle='#000';g.lineWidth=5/k;g.beginPath();g.moveTo(w.x-L,w.y);g.lineTo(w.x+L,w.y);g.moveTo(w.x,w.y-L);g.lineTo(w.x,w.y+L);g.stroke();
    g.strokeStyle='#fff';g.lineWidth=2.5/k;g.stroke();
    g.strokeStyle='#ff4d4d';g.lineWidth=2.5/k;g.beginPath();g.arc(w.x,w.y,7/k,0,7);g.stroke()}
  requestAnimationFrame(aimDraw);
}

/* ================= Board-Zeichnung (mm-Koordinaten) ================= */
function boardMM(g,k){
  g.fillStyle='#050605';g.beginPath();g.arc(0,0,BR.edge,0,7);g.fill();
  for(let i=0;i<20;i++){const dark=i%2===0,single=dark?'#161616':'#efe6cf',ring=dark?'#d6362f':'#1a9a5a';
    [[BR.obull,BR.tIn,single],[BR.tIn,BR.tOut,ring],[BR.tOut,BR.dIn,single],[BR.dIn,BR.dOut,ring]].forEach(([a,b,c])=>{g.beginPath();aimSector(g,a,b,i);g.fillStyle=c;g.fill()})}
  g.fillStyle='#1a9a5a';g.beginPath();g.arc(0,0,BR.obull,0,7);g.fill();
  g.fillStyle='#d6362f';g.beginPath();g.arc(0,0,BR.bull,0,7);g.fill();
  g.strokeStyle='rgba(200,200,190,.55)';g.lineWidth=1.2/k;
  [BR.obull,BR.tIn,BR.tOut,BR.dIn,BR.dOut].forEach(r=>{g.beginPath();g.arc(0,0,r,0,7);g.stroke()});
  for(let i=0;i<20;i++){const a=deg(-99+i*18);g.beginPath();g.moveTo(Math.cos(a)*BR.obull,Math.sin(a)*BR.obull);g.lineTo(Math.cos(a)*BR.dOut,Math.sin(a)*BR.dOut);g.stroke()}
  g.fillStyle='#e9efe9';g.font='14px "Press Start 2P", monospace';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<20;i++){const a=deg(-90+i*18);g.fillText(BO[i],Math.cos(a)*197,Math.sin(a)*197)}
}
function zoneHL(g,k,z){
  const pulse=.55+.45*Math.sin(performance.now()/180);
  g.beginPath();
  if(z.lbl==='BULL')g.arc(0,0,BR.bull,0,7);else{const i=BO.indexOf(z.seg);z.rings.forEach(([a,b])=>aimSector(g,a,b,i))}
  g.fillStyle=`rgba(244,196,48,${.18+.14*pulse})`;g.fill();g.strokeStyle=`rgba(244,196,48,${.6+.4*pulse})`;g.lineWidth=3/k;g.stroke();
}
function dartMM(g,k,d,col1,col2){const u=4/k;g.fillStyle='#000';g.fillRect(d.x-u*1.6,d.y-u*1.6,u*3.2,u*3.2);g.fillStyle='#f4c430';g.fillRect(d.x-u*.6,d.y-u*.6,u*1.2,u*1.2);
  g.fillStyle='#cfd6d2';for(let j=1;j<6;j++)g.fillRect(d.x+j*u,d.y-j*u-u/2,u,u);g.fillStyle=col1;g.fillRect(d.x+6*u,d.y-9*u,2*u,4*u);g.fillStyle=col2;g.fillRect(d.x+5*u,d.y-8*u,4*u,2*u)}
function reticleMM(g,k,w){const L=14/k;
  g.strokeStyle='#000';g.lineWidth=5/k;g.beginPath();g.moveTo(w.x-L,w.y);g.lineTo(w.x+L,w.y);g.moveTo(w.x,w.y-L);g.lineTo(w.x,w.y+L);g.stroke();
  g.strokeStyle='#fff';g.lineWidth=2.5/k;g.stroke();
  g.strokeStyle='#ff4d4d';g.lineWidth=2.5/k;g.beginPath();g.arc(w.x,w.y,6/k,0,7);g.stroke()}

const FCARDS={
 ruhig:{n:'Ruhige Hand',c:1,i:'✋',d:'Nächster Pfeil: Zittern −60 %.',f:F=>{F.me.next.steady=1}},

const fSleep=ms=>new Promise(r=>setTimeout(r,ms));
const fpById=id=>S.players.find(p=>p.id===id)||S.players[0];
function fPlayer(){return fpById(S.free.pid)}
function oppGen(sig){const nick=pick(NICK);return{name:`${pick(FIRST)} „${nick}“ ${pick(LAST)}`,nick,look:randLook(),sig}}
function fScore(x,y){const r=Math.hypot(x,y);if(r<=BR.bull)return{p:50,d:true,l:'BULL'};if(r<=BR.obull)return{p:25,d:false,l:'25'};if(r>BR.dOut)return{p:0,d:false,l:'DANEBEN'};
  let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;const v=BO[Math.floor(((a+9)%360)/18)];const m=r>=BR.tIn&&r<=BR.tOut?3:r>=BR.dIn?2:1;
  return{p:v*m,d:m===2,l:(m===3?'T':m===2?'D':'')+v}}
function fTargetFor(rem){
  if(rem===50)return{x:0,y:0};
  if(rem<=40&&rem%2===0)return bPoint(rem/2,166);
  if(rem<=40)return bPoint(1,135);
  if(rem<=60)return bPoint(rem-40,135);
  if(rem<=100){for(let t=20;t>=10;t--){const r=rem-3*t;if(r>=2&&r<=40&&r%2===0)return bPoint(t,103)}if(rem-50<=20&&rem-50>=1)return bPoint(rem-50,135)}
  return bPoint(20,103);
}
function fZoneKind(pt){const s=fScore(pt.x,pt.y).l;return s==='BULL'||s==='25'?'bull':s[0]==='T'?'tri':s[0]==='D'?'dbl':'single'}
function fWobFactor(){const F=S.free,p=fPlayer(),g=gearOf(p),z=fZoneKind(F.aim);
  let f=1.15-(p.lvl-1)*.035-(g.acc||0)/40;
  if(z==='tri'||z==='bull'){f-=(g.tri||0)/60;if(p.cls==='scorer')f-=.08}
  if(z==='dbl'||z==='bull'){f-=(g.dbl||0)/60;if(p.cls==='finisher')f-=.1}
  return clamp(f,.5,1.25)}
function fAmp(){const F=S.free;return 44*fWobFactor()*F.me.wob*(F.me.next.steady?.4:1)}
function fWob(){const F=S.free,t=performance.now()/1000+F.ph,A=fAmp();
  return{x:F.aim.x+A*Math.sin(t*1.9)*Math.cos(t*.73),y:F.aim.y+A*.9*Math.sin(t*2.6+1.3)}}

  if(F.kind!=='drill'&&F.starter==='op'){F.turn='op';F.busy=true;save();render();setTimeout(fOppTurn,900)}else fStartMyTurn()}

  F.turn='me';F.busy=false;m.darts=3;m.used=0;m.fokus=3+Math.min(2,Math.floor((g.focus||0)/2));m.wob=1;m.next={};m.turnStart=m.rest;F.board=[];
  if(F.kind!=='drill'){m.disc.push(...m.hand);m.hand=[];fDraw(4)}

function fThrow(){
  const F=S.free;if(!F||F.busy||F.turn!=='me'||F.me.used>=F.me.darts)return;

  const s=fScore(x,y);m.next={};m.used++;F.board.push({x,y,me:1});snd(s.p?'hit':'miss');F.busy=true;
  if(F.kind==='drill')return fDrillDart(s);

  const nr=m.rest-pts;
  if(nr===0&&s.d){m.rest=0;F.st.me[0]+=m.turnStart;F.st.me[1]+=m.used;S.stats.hico=Math.max(S.stats.hico||0,m.turnStart);render();fPop(`${s.l} · CHECKOUT!`);snd('checkout');buzz([40,40,80]);return setTimeout(()=>fLegEnd('me'),1200)}
  if(nr<2){m.rest=m.turnStart;F.st.me[1]+=m.used;render();fPop('BUST!');snd('bust');buzz(150);return setTimeout(fEndMyTurn,1000)}

/* Checkout-Vorschlag */
const FTHROWS=(()=>{const a=[];for(let v=20;v>=1;v--)a.push(['T'+v,3*v]);a.push(['BULL',50]);for(let v=20;v>=1;v--)a.push([''+v,v]);a.push(['25',25]);for(let v=20;v>=1;v--)a.push(['D'+v,2*v]);return a})();
const FFIN=[20,16,18,12,10,8,14,19,17,15,13,11,9,7,6,5,4,3,2,1].map(v=>['D'+v,2*v]).concat([['BULL',50]]);
const CO_CACHE={};
function fCheckout(rest,darts){const key=rest+'_'+darts;if(key in CO_CACHE)return CO_CACHE[key];let res='';
  if(rest<=170&&rest>=2&&darts>=1){
    for(const f of FFIN)if(f[1]===rest){res=f[0];break}
    if(!res&&darts>=2){out2:for(const f of FFIN)for(const a of FTHROWS)if(a[1]+f[1]===rest){res=a[0]+' · '+f[0];break out2}}
    if(!res&&darts>=3){out3:for(const f of FFIN)for(const a of FTHROWS)for(const b of FTHROWS)if(a[1]+b[1]+f[1]===rest){res=[a[0],b[0],f[0]].join(' · ');break out3}}}
  return CO_CACHE[key]=res}

/* ================= Landespokal (nach MDSL-Vorbild) ================= */
const PK_UNLOCK=[1,3,5],PK_FINAL=8,KO_N={g:'Gruppenphase',qf:'Viertelfinale',sf:'Halbfinale',f:'Finale'};
function initPokal(st){st=st||S;
  const names=shuffle(CLUBS.filter(c=>!st.rival||c!==st.rival.name)).slice(0,14).concat(st.rival?[st.rival.name]:[pick(CLUBS)]);
  const teams=[{name:st.club,me:true,str:0}].concat(names.map(n=>({name:n,str:clamp(.12+R()*.8,0,1)})));
  const order=[0].concat(shuffle([...Array(15).keys()].map(i=>i+1)));
  const groups=[0,1,2,3].map(g=>order.slice(g*4,g*4+4));
  const gt={};for(let i=0;i<16;i++)gt[i]={p:0,w:0,d:0,l:0,sf:0,sa:0,lf:0,la:0};
  st.pokal={season:st.league?st.league.season:1,teams,groups,gt,gr:0,ko:null,out:false,champ:null,res:[]};
}
function myGroup(){return S.pokal.groups.findIndex(g=>g.includes(0))}
function pkPairs(g,round){const ids=S.pokal.groups[g],sc=makeSchedule(4)[round];return sc.map(([a,b])=>[ids[a],ids[b]])}
function myStr(){const ps=S.players.slice().sort((a,b)=>b.lvl-a.lvl).slice(0,4);let s=0;ps.forEach(p=>s+=p.lvl);s=(s+(4-ps.length))/4;return clamp(.12+s*.08,0,1)}
function tStr(i){return i===0?myStr():S.pokal.teams[i].str}
function simGame(pa){let a=0,b=0;while(a<3&&b<3){R()<pa?a++:b++}return[a,b]}
function simBeg(i,j){const pa=clamp(.5+(tStr(i)-tStr(j))*.55,.12,.88);let sf=0,sa=0,lf=0,la=0;for(let k=0;k<10;k++){const[x,y]=simGame(pa);lf+=x;la+=y;x>y?sf++:sa++}return{sf,sa,lf,la}}
function pkApply(i,j,r){const A=S.pokal.gt[i],B=S.pokal.gt[j];A.sf+=r.sf;A.sa+=r.sa;A.lf+=r.lf;A.la+=r.la;B.sf+=r.sa;B.sa+=r.sf;B.lf+=r.la;B.la+=r.lf;
  if(r.sf>r.sa){A.p+=2;A.w++;B.l++}else if(r.sf<r.sa){B.p+=2;B.w++;A.l++}else{A.p++;B.p++;A.d++;B.d++}}
function groupTable(g){return S.pokal.groups[g].map(i=>({i,...S.pokal.gt[i]})).sort((a,b)=>b.p-a.p||(b.sf-b.sa)-(a.sf-a.sa)||(b.lf-b.la)-(a.lf-a.la))}
function buildKO(){const P=S.pokal,t=[0,1,2,3].map(groupTable);
  const pairs=[[t[0][0].i,t[1][1].i],[t[1][0].i,t[0][1].i],[t[2][0].i,t[3][1].i],[t[3][0].i,t[2][1].i]];
  P.ko={round:'qf',pairs,hist:[]};P.out=!pairs.some(p=>p.includes(0));if(P.out)simKORest()}
function koNext(r){return r==='qf'?'sf':r==='sf'?'f':'done'}
function simKOWinner(a,b){const r=simBeg(a,b);if(r.sf===r.sa)return R()<clamp(.5+(tStr(a)-tStr(b))*.5,.1,.9)?a:b;return r.sf>r.sa?a:b}
function koAdvance(winners){const P=S.pokal,K=P.ko;K.hist.push({round:K.round,pairs:K.pairs,winners});const nr=koNext(K.round);
  if(nr==='done'){K.round='done';K.pairs=[];P.champ=winners[0];if(winners[0]!==0)log(`Landespokal: ${P.teams[winners[0]].name} gewinnt den Pokal.`)}
  else{K.round=nr;K.pairs=[];for(let i=0;i<winners.length;i+=2)K.pairs.push([winners[i],winners[i+1]])}}
function simKORest(){const K=S.pokal.ko;while(K.round!=='done')koAdvance(K.pairs.map(([a,b])=>simKOWinner(a,b)))}
function pokalDue(){const P=S.pokal;if(!P||!S.league)return null;const d=S.league.day;
  if(P.gr<3)return d>=PK_UNLOCK[P.gr]?'g':null;
  if(d<PK_FINAL)return null;
  if(!P.ko)buildKO();
  if(P.out||P.ko.round==='done')return null;return P.ko.round}
function pokalOpp(stage){const P=S.pokal;const pr=stage==='g'?pkPairs(myGroup(),P.gr).find(p=>p.includes(0)):P.ko.pairs.find(p=>p.includes(0));return pr[0]===0?pr[1]:pr[0]}
function pokalResolve(stage,opp,k){
  const P=S.pokal,d=S.league.div,draw=k.sf===k.sa;
  const win=k.sf>k.sa||(draw&&k.sd===true);let money=0,extra=[];
  if(stage==='g'){
    pkApply(0,opp,k);
    for(let g=0;g<4;g++)pkPairs(g,P.gr).forEach(([a,b])=>{if(a!==0&&b!==0)pkApply(a,b,simBeg(a,b))});
    P.gr++;money=win?40*(d+1):draw?15*(d+1):5;
  }else{
    const K=P.ko,winners=K.pairs.map(([a,b])=>(a===0||b===0)?(win?0:opp):simKOWinner(a,b));
    if(!win)P.out=true;money=win?80*(d+1):10;
    koAdvance(winners);if(P.out&&K.round!=='done')simKORest();
    if(P.champ===0){const prize=500*(d+1);money+=prize;S.rep+=10+5*d;S.fans+=50;S.packs.profi=(S.packs.profi||0)+1;S.stats.wins++;
      S.trophies.push({tier:21,n:`Landespokal (Saison ${P.season})`,i:'🏆',w:S.week});log(`🏆 ${S.club} gewinnt den Landespokal!`);extra.push(['Pokalsieg!',`+${prize} € · Profi-Pack`])}
  }
  S.money+=money;
  P.res.push({stage,opp:P.teams[opp].name,sf:k.sf,sa:k.sa,sd:draw&&stage!=='g'?k.sd:null});
  log(`Landespokal (${KO_N[stage]}): ${S.club} ${k.sf}:${k.sa} ${P.teams[opp].name}${draw&&stage!=='g'?(k.sd?' n. Sudden Death':' n. Sudden Death verloren'):''}.`);
  return{win,draw:draw&&stage==='g',money,extra};
}
function pokalAutoSim(){let n=0,msg=[];while(pokalDue()&&n<5){n++;const st=pokalDue(),opp=pokalOpp(st),r=simBeg(0,opp);r.sd=r.sf===r.sa?R()<.5:null;const o=pokalResolve(st,opp,r);msg.push(`Pokal (${KO_N[st]}, simuliert): ${r.sf}:${r.sa} gegen ${S.pokal.teams[opp].name}`)}return msg.join(' ')}
function pkP(id){const k=S.run&&S.run.pk;return(k&&k.subs[id])||S.players.find(p=>p.id===id)}
function pokalLineup(){
  const N=4;if(!UI.pkl||UI.pkl.length!==N||UI.pkl.some(id=>id!=='sub'&&!S.players.find(p=>p.id===id)))UI.pkl=S.players.slice().sort((a,b)=>b.lvl-a.lvl).slice(0,N).map(p=>p.id).concat(['sub','sub','sub','sub']).slice(0,N);

   <div class="small"><b>Aufstellung</b> <span class="mut tiny">(▲ zum Umsortieren)</span></div>
   ${lu.map((id,i)=>{const p=id==='sub'?null:S.players.find(x=>x.id===id);return `<div class="opt row" style="cursor:default"><b style="width:22px">${i+1}.</b>${p?personImg(p.look,36):'<div style="width:27px;text-align:center;font-size:20px">🙋</div>'}<div style="flex:1"><b class="small">${p?esc(p.name)+` <span class="lvl px">Lv${p.lvl}</span>`:'Ersatzspieler'}</b></div>${i>0?`<button class="btn gray sm" data-pu="${i}">▲</button>`:''}</div>`}).join('')}
   <button class="btn block" id="pgo">Pokalspiel starten</button><button class="btn gray" onclick="closeModal()">Abbrechen</button>`);
  document.querySelectorAll('[data-pu]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pu;[lu[i-1],lu[i]]=[lu[i],lu[i-1]];pokalLineup()});
  $('#pgo').onclick=()=>{closeModal();pokalBegin(lu.slice())};
}
function pokalBegin(lu){
  const st=pokalDue();if(!st)return;const opp=pokalOpp(st),subs={};
  lu=lu.map((id,i)=>{if(id!=='sub')return id;const sp=makePlayer(`${pick(FIRST)} (Ersatz)`,pick(BASE_CLS));sp.id='sub'+i;subs[sp.id]=sp;return sp.id});
  const th=[0,1,2,3].map(()=>`${pick(FIRST)} ${pick(LAST)}`),games=[];
  for(let i=0;i<4;i++)games.push({t:'E',m:[lu[i]],o:[th[i]]});
  for(let i=0;i<4;i++)games.push({t:'E',m:[lu[i]],o:[th[(i+1)%4]]});
  games.push({t:'D',m:[lu[0],lu[1]],o:[th[0],th[1]]});games.push({t:'D',m:[lu[2],lu[3]],o:[th[2],th[3]]});
  S.run={mode:'pokal',tier:S.league.div,pid:null,deck:[],relics:[],nerves:1,maxN:1,gold:0,step:0,steps:99,map:[],path:[],added:[],combat:null,won:0,matches:0,
    pk:{stage:st,opp,games,idx:0,sf:0,sa:0,lf:0,la:0,sd:null,subs,lu}};
  save();render();
}
function pkWinChance(ids){const ps=ids.map(pkP);const lv=ps.reduce((a,p)=>a+p.lvl+((gearOf(p).acc||0)/4),0)/ps.length;return clamp(.5+(.12+lv*.08-tStr(S.run.pk.opp))*.6,.12,.88)}
function pkPlay(){
  const r=S.run,k=r.pk,sd=k.sd==='pending',g=sd?{t:'E',m:[k.lu.slice().sort((a,b)=>pkP(b).lvl-pkP(a).lvl)[0]],o:['Sudden Death']}:k.games[k.idx],ps=g.m.map(pkP);
  r.pid=g.m[0];r.deck=ps.flatMap(p=>p.deck.map(c=>({id:c.id,up:c.up,u:uid()})));r.gear=gearOf(ps[0]);
  const mx=Math.round(ps.reduce((a,p)=>a+startNerves(p),0)/ps.length);r.nerves=mx;r.maxN=mx;
  const s=tStr(k.opp);r.step=Math.round(s*4)+2;
  startCombat(s>.72&&R()<.5?'e':'n');
  const C=S.run.combat;C.opp.club=S.pokal.teams[k.opp].name;
  if(sd){C.label='Pokal · Sudden Death';C.aim='dbl';C.opp.name=`${pick(FIRST)} ${pick(LAST)}`;setTimeout(()=>toast('🎯 Sudden Death! Ein Leg entscheidet – deine Doppel wirfst du selbst.'),400)}
  else{C.label=g.t==='D'?`Pokal · Doppel ${k.idx-7}/2`:`Pokal · Einzel ${k.idx+1}/8`;C.opp.name=g.o.join(' & ')}
  save();render();
}
function pkRecord(win,lf,la){const k=S.run.pk,g=k.games[k.idx];g.res={win,lf,la};win?k.sf++:k.sa++;k.lf+=lf;k.la+=la;k.idx++;
  g.m.forEach(id=>{const p=S.players.find(x=>x.id===id);if(p){p.xp+=win?10:3;checkLvl(p)}});
  if(k.idx>=10&&k.sf===k.sa&&k.stage!=='g')k.sd='pending';}
function pkSim(all){const k=S.run.pk;do{if(k.idx>=10)break;const g=k.games[k.idx],[x,y]=simGame(pkWinChance(g.m));pkRecord(x>y,x,y)}while(all);
  if(k.sd==='pending'&&all){k.sd=R()<pkWinChance([k.lu[0]]);}
  save();render();if(k.idx>=10&&k.sd!=='pending')setTimeout(pokalFinish,300)}
function pokalGameEnd(win){const r=S.run,C=r.combat,k=r.pk;
  if(k.sd==='pending'){r.combat=null;k.sd=win;save();render();return setTimeout(pokalFinish,300)}
  const lf=C?(win?C.need:C.me.legs):0,la=C?(win?C.opp.legs:C.need):3;r.combat=null;r.sub=null;
  pkRecord(win,lf,la);snd(win?'coin':'hurt');toast(`${win?'Sieg':'Niederlage'} · Stand ${k.sf}:${k.sa}`);save();render();
  if(k.idx>=10&&k.sd!=='pending')setTimeout(pokalFinish,500)}

   <div class="panel small"><div class="row between"><span>Legs</span><b>${k.lf}:${k.la}</b></div><div class="row between"><span>Prämie</span><b>+${o.money} €</b></div>${o.extra.map(([a,b])=>`<div class="row between"><span>${a}</span><b>${b}</b></div>`).join('')}</div>

function renderPokal(app){
  const r=S.run,k=r.pk,team=S.pokal.teams[k.opp];
  const nm=id=>{const p=pkP(id);return p?p.name:'?'};
  app.innerHTML=`<div class="top"><div class="st">Pokal<b>🏆 ${KO_N[k.stage]}</b></div><div class="st">Stand<b class="px" style="font-size:13px">${k.sf}:${k.sa}</b></div><div class="st">Legs<b>${k.lf}:${k.la}</b></div></div>

  const pts=[ip(P,x,y,h),ip(P,x+w,y,h),ip(P,x+w,y+d,0),ip(P,x,y+d,0),ip(P,x+w,y+d,h),ip(P,x,y+d,h)],xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);

function plStart(){const pool=LEGENDS.filter(L=>!S.players.some(p=>p.legend===L.key)).map(L=>({name:L.name,look:L.look,str:.7+R()*.25})),extra=['Rob „Hochspannung“ Kreuzer','Johnny „Frettchen“ Klaiber','Steffen „Die Kugel“ Brandt','Nate „Die Natter“ Aschberg'];
  while(pool.length<7)pool.push({name:extra[pool.length%4],look:randLook(),str:.65+R()*.25});
  const me=S.players.slice().sort((a,b)=>b.lvl-a.lvl)[0];
  S.pl={season:S.league.season,night:0,pid:me.id,table:[{name:me.name,me:true,pts:0,lf:0,la:0,w:0,l:0}].concat(shuffle(pool).slice(0,7).map(x=>({...x,pts:0,lf:0,la:0,w:0,l:0}))),sched:makeSchedule(8).slice(0,7),done:false,po:null,champ:null};

function plTable(){return S.pl.table.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts||(b.lf-b.la)-(a.lf-a.la))}
function plStr(i){if(i===0){const p=fpById(S.pl.pid);return clamp(.2+p.lvl*.08,0,1)}return S.pl.table[i].str}
function plSimMatch(a,b){const pa=clamp(.5+(plStr(a)-plStr(b))*.6,.15,.85);let x=0,y=0;while(x<4&&y<4)R()<pa?x++:y++;return[x,y]}
function plApply(a,b,x,y){const T=S.pl.table;T[a].lf+=x;T[a].la+=y;T[b].lf+=y;T[b].la+=x;if(x>y){T[a].pts+=2;T[a].w++;T[b].l++}else{T[b].pts+=2;T[b].w++;T[a].l++}}
function plOpp(){const P=S.pl;if(P.night<7){const pr=P.sched[P.night].find(p=>p.includes(0));return pr[0]===0?pr[1]:pr[0]}if(P.po&&!P.po.done){const pr=P.po.pairs.find(p=>p.includes(0));return pr?(pr[0]===0?pr[1]:pr[0]):-1}return -1}
function plDue(){return S.pl&&!S.pl.champ&&!S.plDone&&plOpp()>=0}
function plPlay(){const P=S.pl,oi=plOpp(),p=fpById(P.pid),mx=startNerves(p);
  S.run={mode:'pl',tier:4,pid:p.id,deck:p.deck.map(c=>({id:c.id,up:c.up,u:uid()})),gear:gearOf(p),relics:[],nerves:mx,maxN:mx,gold:0,step:3,steps:99,map:[],path:[],added:[],combat:null,won:0,matches:0,plOpp:oi};
  startCombat('e');const C=S.run.combat,O=P.table[oi];C.opp.name=O.name;C.opp.nick=O.name.split('„')[1]?O.name.split('„')[1].split('“')[0]:O.name;if(O.look)C.opp.look=Object.assign({},O.look);C.label=P.night<7?`Premier-Nacht ${P.night+1}/7`:(P.po.round==='sf'?'Premier · Halbfinale':'Premier · Finale');save();render()}
function plNightResult(myWin,x,y){const P=S.pl,oi=plOpp();
  if(P.night<7){plApply(0,oi,x,y);P.sched[P.night].forEach(([a,b])=>{if(a!==0&&b!==0){const[q,w]=plSimMatch(a,b);plApply(a,b,q,w)}});P.night++;
    if(P.night===7){const t=plTable().slice(0,4).map(t=>t.i);P.po={round:'sf',pairs:[[t[0],t[3]],[t[1],t[2]]],done:false,win:[]};if(!t.includes(0)){plFinishSim();}}}
  else{const po=P.po,w=[];po.pairs.forEach(([a,b])=>{if(a===0||b===0)w.push(myWin?0:(a===0?b:a));else{const[q,z]=plSimMatch(a,b);w.push(q>z?a:b)}});
    if(po.round==='sf'){if(!w.includes(0)){po.pairs=[[w[0],w[1]]];po.round='f';plFinishSim()}else{po.pairs=[[w[0],w[1]]];po.round='f'}}else{P.champ=w[0];po.done=true}}
  const money=myWin?300:50;S.money+=money;if(myWin)S.rep+=3;
  if(P.champ===0){S.money+=3000;S.rep+=25;S.fans+=150;S.trophies.push({tier:31,n:'Premier-Nächte',i:'🌟',w:S.week});S.stats.wins++;log('🌟🏆 Sieg in den Premier-Nächten!')}
  return money}
function plFinishSim(){const P=S.pl;while(!P.champ){const w=P.po.pairs.map(([a,b])=>{const[q,z]=plSimMatch(a,b);return q>z?a:b});if(P.po.round==='sf'){P.po.pairs=[[w[0],w[1]]];P.po.round='f'}else{P.champ=w[0];P.po.done=true}}}

  modal(`<div style="text-align:center"><div style="font-size:44px">${win?'🌟':'😤'}</div><h3>${win?'Sieg in der Premier-Nacht!':'Niederlage'}</h3><div class="px" style="font-size:18px;margin:8px 0">${x} : ${y}</div></div><div class="panel small"><div class="row between"><span>Prämie</span><b>+${m} €</b></div>${S.pl.champ===0?'<div class="row between"><span>🏆 Premier-Champion!</span><b>+3.000 €</b></div>':''}</div><button class="btn block" onclick="closeModal()">Weiter</button>`)}

}

  S.seen=S.seen||{};const k=coachKey();let txt=null,step=null;
  if(k==='match'){const n=S.seen.matchStep||0;if(n<COACH_MATCH.length){txt=COACH_MATCH[n];step=n}}
  let sk=k;
  if(k&&k!=='match'&&!S.seen[k])txt=COACH[k];else if(k&&COACH2[k]&&!S.seen[k+'2']){txt=COACH2[k];sk=k+'2'}
  if(!txt||document.querySelector('#modal.on')){if(el)el.remove();if(txt&&!el)setTimeout(coachCheck,600);return}
  const box=el||document.createElement('div');box.id='coach';box.className=k==='match'||k==='free'?'top':'';
  box.innerHTML=`<img src="${portraitURL({h:'#8a8a8a',s:'#f1c9a5',t:'#1f9d55',w:'#d9333f',p:'#222',beard:true})}" alt=""><div><b class="tiny" style="color:var(--gold)">Trainer Kalle${step!=null?` · ${step+1}/${COACH_MATCH.length}`:''}</b><div class="small">${txt}</div>
   <div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" id="coachok">${step!=null&&step<COACH_MATCH.length-1?'Weiter':'Verstanden'}</button><button class="btn gray sm" id="coachoff">Tipps aus</button></div></div>`;
  if(!el)document.body.appendChild(box);
  box.querySelector('#coachok').onclick=()=>{if(step!=null)S.seen.matchStep=step+1;else{S.seen[sk]=true;if(sk!==k)S.seen[k]=true}save();coachCheck()};
  box.querySelector('#coachoff').onclick=()=>{S.tips=false;save();coachCheck();toast('Tipps aus. Am PC im Büro wieder einschaltbar.')};
}

let MUS=null;
function musicToggle(on){S.music=on;save();if(on)musicStart();else musicStop()}
function musicStop(){if(MUS){clearInterval(MUS.t);try{MUS.ctx.close()}catch(e){}MUS=null}}
function musicStart(){if(MUS||!S||!S.music)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),g=ctx.createGain();g.gain.value=.035;g.connect(ctx.destination);
  const bass=[45,45,52,52,50,50,47,52],arp=[[69,72,76],[69,72,76],[71,76,79],[71,76,79],[69,74,77],[69,74,77],[67,71,74],[71,76,79]],bpm=112,step=60/bpm/2;let i=0,t0=ctx.currentTime+.1;
  const note=(m,t,d,type,v)=>{const o=ctx.createOscillator(),e=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+.02)};
  const sched=()=>{while(t0<ctx.currentTime+.6){const bar=Math.floor(i/8)%8,s=i%8;if(s%2===0)note(bass[bar]-12,t0,step*1.8,'triangle',.9);const ch=arp[bar];note(ch[s%3]+(s>=6?12:0),t0,step*.9,'square',.35);if(s===4)note(84,t0,.05,'square',.15);i++;t0+=step}};
  sched();MUS={ctx,t:setInterval(sched,200)}}catch(e){}}
document.addEventListener('pointerdown',()=>{if(S&&S.music&&!MUS)musicStart()},{passive:true});

const BORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const GOOD_REST={40:3,32:3,36:2,16:2,24:2,20:2,50:2,8:1,12:1,4:1,28:1,64:1,80:1,100:1};
const FIN_PREF=[40,32,36,24,20,16,50,8,12,28,4,30,34,38,26,22,18,14,10,6,2];
function throwsList(){const L=[];for(let n=20;n>=10;n--)L.push(['T'+n,n*3]);L.push(['Bull',50],['25',25]);for(let n=20;n>=1;n--)L.push([''+n,n]);for(let n=9;n>=1;n--)L.push(['T'+n,n*3]);for(let n=20;n>=1;n--)L.push(['D'+n,n*2]);return L}
const THROWS=throwsList();
const coCache={};
function coPath(rest){
  if(rest>170||rest<2)return null;if(coCache[rest]!==undefined)return coCache[rest];
  const fin=v=>v===50?'Bull':'D'+(v/2);const T1=THROWS.filter(t=>!t[0].startsWith('D'));let res=null,best=1e9;
  if(FIN_PREF.includes(rest)&&FIN_PREF.indexOf(rest)<8)res=[fin(rest)];
  if(!res){FIN_PREF.forEach((f,fi)=>{T1.forEach((a,ai)=>{if(a[1]===rest-f){const sc=ai+fi*2;if(sc<best){best=sc;res=[a[0],fin(f)]}}})});
    if(!res&&FIN_PREF.includes(rest))res=[fin(rest)]}
  if(!res){FIN_PREF.forEach((f,fi)=>{const rem=rest-f;T1.forEach((a,ai)=>{if(ai>14&&a[0].startsWith('T')===false&&a[1]>20)return;const bi=T1.findIndex(t=>t[1]===rem-a[1]);if(bi>=0){const sc=ai+bi+fi*2;if(sc<best){best=sc;res=[a[0],T1[bi][0],fin(f)]}}})})}
  return coCache[rest]=res}
function bestSetup(rest){let best=null;for(let s=1;s<=20;s++){const v=GOOD_REST[rest-s];if(v&&(!best||v>best.v||(v===best.v&&s>best.s)))best={s,v}}return best}
function markPos(sp,hit){
  const k=sp.k,n=numOf(sp);let ang,r;
  if(k==='bull'||n==='B'){const a=R()*Math.PI*2,rr=hit?(sp.pts===25?.09:.03):.14+R()*.2;return{x:50+Math.cos(a)*rr*50,y:50+Math.sin(a)*rr*50}}
  const num=typeof n==='number'?n:20;let idx=BORDER.indexOf(num);
  if(!hit&&R()<.6)idx=(idx+(R()<.5?1:19))%20;
  ang=-Math.PI/2+idx*Math.PI/10+(R()-.5)*.22;
  if(k==='triple')r=hit?.46:(R()<.5?.33:.62);else if(k==='double')r=hit?.815:(R()<.6?.7:.95);else r=hit?(R()<.5?.3:.63):.63;
  r=Math.min(.98,r+(R()-.5)*.03);
  return{x:50+Math.cos(ang)*r*50,y:50+Math.sin(ang)*r*50}}
function addMark(sp,hit){const me=S.run.combat.me;me.marks=me.marks||[];const p=markPos(sp,hit);me.marks.push({...p,hit,fresh:1});if(me.marks.length>9)me.marks.shift()}
function boardHTML(me){
  const mk=(me.marks||[]).map((m,i)=>{const f=m.fresh;m.fresh=0;return `<i class="dm ${f?'new':''}" style="left:${m.x}%;top:${m.y}%;${f?`animation-delay:${(i%3)*.12}s`:''}"></i>`}).join('');
  return `<div class="bwrap"><img class="sp" src="${boardURL()}" style="width:min(38vw,150px);height:min(38vw,150px)">${mk}</div>`}
function caller(t,col){const cb=document.querySelector('.cb');if(!cb)return;const d=document.createElement('div');d.className='caller';d.style.color=col||'#f4c430';d.textContent=t;cb.appendChild(d);setTimeout(()=>d.remove(),1900)}
const slow=ms=>new Promise(r=>setTimeout(r,ms));
// Tracking nach jedem Wurf
function trackThrow(sp,hit){
  const C=S.run.combat,me=C.me,n=numOf(sp);
  if(sp.ch<1||hit)addMark(sp,hit);
  if(hit&&n!=null&&(sp.k==='triple'||sp.k==='bull')){me.board=me.board||{};const key=sp.k==='bull'?'B':n;me.board[key]=(me.board[key]||0)+1;
    if(sp.k==='triple'&&me.board[key]>=3&&sp.ch<1){me.block+=3;setTimeout(()=>fx('🏹 Robin Hood! +3 Fokus','#f4c430'),350)}}
  // Shanghai
  if(hit&&typeof n==='number'&&['single','double','triple'].includes(sp.k)){me.shg=me.shg||{};const s=me.shg[n]=me.shg[n]||{};s[sp.k]=1;
    if(s.single&&s.double&&s.triple&&!s.done){s.done=1;me.block+=6;heal(4);C.opp.st.nerv+=2;setTimeout(()=>caller('SHANGHAI!','#f4c430'),250);S.stats.shanghai=(S.stats.shanghai||0)+1}}
  if(hit&&sp.k==='double'&&has('doppelherz')){draw(1);me.block+=4}
  // Bull-Serie
  if(hit&&sp.k==='bull'){C.bullCnt=(C.bullCnt||0)+(sp.bc||1)*(has('bullmagnet')||(player()&&player().cls==='bulljaeger')?2:1);if(C.bullCnt>=3){C.bullCnt=0;me.plusDart=(me.plusDart||0)+1;me.block+=5;setTimeout(()=>caller('BULLSEYE-SERIE!','#3aff8c'),250)}}
  // Triple-Serie (180-Jäger)
  if(sp.ch<1||sp.k==='triple'){if(hit&&sp.k==='triple'){C.triStreak=(C.triStreak||0)+1;if(C.triStreak%3===0){me.plusDart=(me.plusDart||0)+1;setTimeout(()=>fx('🔥 3 Triples in Serie: +1 Dart nächsten Zug','#ffb347'),500)}}else C.triStreak=0}
}
function blockPen(sp){const me=S.run.combat.me;if(!me.board)return 0;const n=numOf(sp);const key=sp.k==='bull'?'B':n;const c=me.board[key]||0;if(!c||sp.k==='double'||sp.k==='single')return 0;return .09*c}
function endTurnSetup(){
  const C=S.run.combat,me=C.me;if(me.rest===me.turnStart||me.rest<2)return;
  const v=GOOD_REST[me.rest];
  if(v){const cm=player()&&player().cls==='rechner'?2:1;me.carry=(me.carry||0)+v*2*cm;if(v>=2)heal(1);setTimeout(()=>fx(`📐 Rest ${me.rest} gestellt · +${v*2} Fokus`,'#9cc8ff'),100)}
  else if(isBogey(me.rest)){S.run.nerves-=2;setTimeout(()=>fx(`😬 Bogey-Rest ${me.rest} · −2 ❤️`,'#ff9a9a'),100)}}
function coBonus(start){const C=S.run.combat,me=C.me,out=[];
  if(start>=100){S.stats.co100=(S.stats.co100||0)+1;const g=start>=170?60:start>=130?30:15;S.run.gold=(S.run.gold||0)+g;heal(start>=170?10:4);out.push(`+${g} 💰`)}
  if(C.opp.intent&&C.opp.intent.type==='co'){heal(3);out.push('BREAK!')}
  if(start>=170)setTimeout(()=>caller('THE BIG FISH! 170','#f4c430'),200);
  else if(start>=100)setTimeout(()=>caller(`${start} CHECKOUT!`,'#f4c430'),200);
  if(out.length)setTimeout(()=>toast(out.join(' · ')),900)}
function comboChips(me,C){
  let h='';const b=me.board||{};const bl=Object.entries(b).filter(([k,v])=>v>=1).map(([k,v])=>`${k==='B'?'Bull':'T'+k}×${v}`);
  if(bl.length)h+=`<span class="chip" title="Darts im Feld machen den nächsten Triple-Wurf dorthin schwerer" style="border-color:#8a8f98">🧱 ${bl.join(' ')}</span>`;
  if(C.bullCnt)h+=`<span class="chip" style="border-color:#3aff8c">🐂 ${C.bullCnt}/3</span>`;
  if(C.triStreak)h+=`<span class="chip" style="border-color:#ffb347">🔥 T-Serie ${C.triStreak}</span>`;
  const sh=Object.entries(me.shg||{}).find(([n,s])=>!s.done&&Object.keys(s).length>=2);if(sh)h+=`<span class="chip" style="border-color:#f4c430">🀄 ${sh[0]}: ${sh[1].single?'S':'·'}${sh[1].double?'D':'·'}${sh[1].triple?'T':'·'}</span>`;
  if(me.risk)h+=`<span class="chip" style="border-color:#d9333f;background:#3a1416">🎲 RISIKO ×1.5</span>`;
  return h}
function coHint(me){const p=coPath(me.rest);if(p)return `<div class="tiny" style="color:var(--gold)">Weg: ${p.join(' · ')}</div>`;if(me.rest<=170&&isBogey(me.rest))return '<div class="tiny" style="color:#ff9a9a">Kein 3-Dart-Finish</div>';if(me.rest>170&&me.rest-60<=170)return '<div class="tiny mut">Stell dir ein Finish</div>';return ''}
function coWarn(C){const o=C.opp,it=o.intent;if(C.phase!=='player'||!it||it.type!=='co'||C.rule==='nebel')return '';const ch=Math.round(clamp(it.ch-(o.st.nerv>0?.2:0)-(o.coMinus||0),0,1)*100);

function finChart(){const F=MG().fin;if(F.length<2)return '<div class="small mut">Nach zwei Wochen erscheint hier dein Verlauf.</div>';
  const W=320,H=120,mx=Math.max(...F.map(f=>Math.max(f.inc,f.out)),1),bw=W/F.length;const mm=F.map(f=>f.money),lo=Math.min(0,...mm),hi=Math.max(...mm,1);
  const bars=F.map((f,i)=>{const hi1=f.inc/mx*(H-20),ho=f.out/mx*(H-20);return `<rect x="${i*bw+1}" y="${H-hi1}" width="${bw/2-1}" height="${hi1}" fill="#1f9d55"/><rect x="${i*bw+bw/2}" y="${H-ho}" width="${bw/2-1}" height="${ho}" fill="#d9333f"/>`}).join('');
  const line=F.map((f,i)=>`${i*bw+bw/2},${H-((f.money-lo)/(hi-lo||1))*(H-20)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#0b120e;border-radius:8px;margin-top:8px">${bars}<polyline points="${line}" fill="none" stroke="#f4c430" stroke-width="2"/></svg><div class="tiny mut" style="margin-top:4px"><span style="color:#2fd673">■</span> Einnahmen <span style="color:#ff6a6a">■</span> Ausgaben <span style="color:var(--gold)">━</span> Kontostand · letzte ${F.length} Wochen</div>`}

function autoScore(c){const C=S.run.combat,me=C.me,d=CARDS[c.id];if(d.t==='curse'||d.c>me.darts||(has('sammler')?0:(d.fc||0))>me.block)return -1e9;

function playWalk(i,dur){if(S&&S.mute)return;try{const W=WALK[i%WALK.length],ctx=new(window.AudioContext||window.webkitAudioContext)(),g=ctx.createGain();g.gain.value=.05;g.connect(ctx.destination);const st=60/W.bpm/2;let t=ctx.currentTime+.05;const n=Math.floor(dur/st);
  for(let k=0;k<n;k++){const m=W.m[k%W.m.length];const o=ctx.createOscillator(),e=ctx.createGain();o.type='square';o.frequency.value=440*Math.pow(2,(m-69)/12);e.gain.setValueAtTime(.4,t);e.gain.exponentialRampToValueAtTime(.001,t+st*.9);o.connect(e);e.connect(g);o.start(t);o.stop(t+st);
    if(k%2===0){const b=ctx.createOscillator(),eb=ctx.createGain();b.type='triangle';b.frequency.value=440*Math.pow(2,(W.m[(k>>2<<2)%W.m.length]-12-69)/12);eb.gain.setValueAtTime(.8,t);eb.gain.exponentialRampToValueAtTime(.001,t+st*1.8);b.connect(eb);eb.connect(g);b.start(t);b.stop(t+st*2)}t+=st}
  setTimeout(()=>{try{ctx.close()}catch(e){}},dur*1000+500)}catch(e){}}

  else{const f=pick(FIRST),l=pick(LAST),n=pick(NICK);o={name:`${f} „${n}“ ${l}`,nick:n,ab:[],look:randLook()}}
  const t=lvOf(tier),sb=Math.round(step*1.5);
  o.min=24+t*11+sb;o.max=48+t*17+sb;o.dr=2+t*2;o.finish=Math.min(40+t*12,110);o.co=.22+t*.07;
  if(kind==='e'){o.min+=8;o.max+=10;o.dr+=2;o.co+=.06;o.ab.push(pick(['zittern','druck','cold','comeback']))}

function rollIntent(){

  if(o.rest<=o.finish){o.intent={type:'co',ch:clamp(o.co+o.coBonus+(o.ab.includes('cold')?.15:0),.05,.95)};return}

  if(o.ab.includes('comeback')&&o.rest>me.rest+60)sc+=20;

  let dr=0;if(R()<(o.ab.includes('druck')?1:.38))dr=rnd(Math.max(1,o.dr-1),o.dr+2);

function accFor(sp){
  const C=S.run.combat,me=C.me,p=player();
  if(sp.ch>=1)return 1;
  if(me.sure&&sp.k==='double')return 1;
  if(me.sureAll)return 1;
  let b=me.accBuff+(me.pw.acc||0)+GE('acc')/100;const lg=p&&p.legend;
  if(lg==='gruen')b+=.06;if(lg==='macht')b+=.05;if(lg==='atom'&&(sp.k==='triple'||sp.k==='bull'))b+=.12;if((lg==='eis'&&(sp.k==='double'||sp.k==='bull')))b+=.12;if(lg==='koenigin'&&(sp.k==='double'||sp.k==='bull'))b+=.10;
  if(sp.k==='double'||sp.k==='bull')b+=(me.dblNext||0);b+=(sp.bonus||0);
  {const rn=numOf(sp);if(rn!=null&&me.rhythm&&me.rhythm.num===rn)b+=Math.min(4,me.rhythm.n)*.04*(me.pw.prec?2:1)*(hasT(p,'rhythm')?1.5:1)*(has('spiegel')?2:1)}
  if(hasT(p,'dbl')&&(sp.k==='double'))b+=.06;if(hasT(p,'tri')&&sp.k==='triple')b+=.06;if(hasT(p,'heim')&&(S.run.mode==='liga'||S.run.mode==='pokal'))b+=.08;if(hasT(p,'spaet')&&C.leg>=2)b+=.06;if(sp.k==='double'&&(sp.pts===32||sp.pts===40))b+=(me.pw.fav||0);
  if(sp.k==='triple'||sp.k==='bull'){if(p.cls==='scorer')b+=.10;if(has('tungsten'))b+=.08;b+=GE('tri')/100}
  if(sp.k==='double'||sp.k==='bull'){if(p.cls==='finisher')b+=.12;if(has('flights'))b+=.08;b+=me.pw.ice+GE('dbl')/100}
  if(S.run.nerves<S.run.maxN*.3)b-=.10;
  b-=blockPen(sp);if(me.risk)b-=.06;b+=presBonus()+condAcc(p);
  if(p){if(p.cls==='bulljaeger'&&sp.k==='bull')b+=.15;if(p.cls==='champion')b+=.08;if(p.cls==='rechner'&&sp.k==='double')b+=.06}
  if(has('bullmagnet')){if(sp.k==='bull')b+=.25;if(sp.k==='triple')b-=.10}if(has('kaltblut')&&sp.k==='double')b+=.18;
  return clamp(sp.ch+b,.05,.98);

function outcome(sp,rest,hit){
  const me=S.run.combat.me;
  let pts=hit?sp.pts:(sp.alt||0);
  if(hit&&(sp.k==='double'||sp.k==='bull')&&rest<=sp.pts&&rest>=2)return{co:true};
  if(hit&&(sp.k==='single'||sp.k==='triple'))pts+=me.pw.heat+GE('heat');
  if(hit&&sp.k==='triple')pts+=(me.pw.chain||0);
  if(!hit&&sp.k==='triple')pts+=GE('grip');

  if(hit&&me.risk&&(sp.k==='single'||sp.k==='triple'))pts=Math.round(pts*(has('allin')?2:1.5));
  if(pts>0&&rest-pts<2)return{bust:true,pts};
  return{rest:rest-pts,pts};

function preview(card){

function throwDart(sp,forced){

  {const rk=$('#risk');if(rk)rk.onclick=()=>{if(!myTurn||me.played>0)return;modal(`<h3>🎲 Risiko-Zug?</h3><div class="small">Diesen Zug zählen <b>alle Treffer ×1,5</b> (Single und Triple), aber −6% Treffer. <b>Ein einziger Fehlwurf</b> und alle Punkte dieses Zugs sind weg, der Zug endet.</div><button class="btn red" id="rky">Volles Risiko!</button><button class="btn gray" onclick="closeModal()">Lieber sicher</button>`);$('#rky').onclick=()=>{me.risk=true;closeModal();snd('power');save();render();fx('🎲 RISIKO!','#ff5a5a')}}}
  app.querySelectorAll('[data-ab]').forEach(el=>el.onclick=()=>toast(AB_TXT[el.dataset.ab]));
  app.querySelectorAll('[data-brule]').forEach(el=>el.onclick=()=>{const B=BRULES[el.dataset.brule];toast(`${B.i} ${B.n}: ${B.d}`)});
  $('#dp').onclick=()=>showDeck(me.draw,'Nachziehstapel');
  $('#dc').onclick=()=>showDeck(me.discard,'Ablagestapel');
  $('#menu').onclick=()=>{modal(`<h3>Match-Menü</h3><button class="btn gray" id="mh">❔ Regeln</button><button class="btn gray" id="md">🃏 Turnier-Deck</button><button class="btn gray" id="mm">${S.mute?'🔇 Ton ist aus':'🔊 Ton ist an'}</button><button class="btn red" id="mq">🏳 Match aufgeben</button><button class="btn" onclick="closeModal()">Zurück</button>`);
    $('#mh').onclick=()=>showHelp(false);$('#md').onclick=()=>showDeck(S.run.deck,'Turnier-Deck');$('#mq').onclick=()=>{closeModal();matchLost()};$('#mm').onclick=()=>{S.mute=!S.mute;save();closeModal()}};
}

window.addEventListener('DOMContentLoaded',()=>{
  const local=loadLocal();
  if(local&&local.run&&local.run.combat){S=fixLoaded(local);const C=S.run.combat;if(C.phase==='opp'){render();setTimeout(oppTurn,600)}else render()}
  else render();
});
window.__G={get S(){return S},set S(v){S=v},startLeague,startEinzel,oppIndex,openPack,makeItem,newGame,playCard,endTurn,enterNode,startRun,render,closeModal,endWeek,CARDS};
</script>
